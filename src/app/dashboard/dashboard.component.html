<div class="page-container">
      <h2 class="page-title">Dashboard</h2>

      <div class="kpi-grid">
        <div class="card kpi">
          <span class="kpi-dot" style="background: var(--brand)"></span>
          <span class="kpi-num" style="color: var(--brand)">{{ total }}</span>
          <span class="kpi-label">Total tickets</span>
        </div>

        @for (s of statusData; track s.name) {
          <div class="card kpi">
            <span class="kpi-dot" [style.background]="statusColors[s.name]"></span>
            <span class="kpi-num" [style.color]="statusColors[s.name]">{{ s.count }}</span>
            <span class="kpi-label">{{ s.name }}</span>
          </div>
        }
      </div>

      <div class="charts">
        <div class="card chart-card">
          <dx-pie-chart
            [dataSource]="statusData"
            type="doughnut"
            [customizePoint]="customizeStatusPoint">
            <dxo-title text="Tickets by status"></dxo-title>
            <dxi-series argumentField="name" valueField="count">
              <dxo-label [visible]="true"></dxo-label>
            </dxi-series>
            <dxo-legend horizontalAlignment="center" verticalAlignment="bottom"></dxo-legend>
          </dx-pie-chart>
        </div>

        <div class="card chart-card">
          <dx-chart
            [dataSource]="priorityData"
            [customizePoint]="customizePriorityPoint">
            <dxo-title text="Tickets by priority"></dxo-title>
            <dxi-series argumentField="name" valueField="count" type="bar"></dxi-series>
            <dxo-legend [visible]="false"></dxo-legend>
          </dx-chart>
        </div>
      </div>
</div>
